<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotería PRO - Generador Universal Premium</title>
  
  <style>
    /* ==========================================
       🎨 DISEÑO PREMIUM MODERN-MEXICAN (CSS)
       ========================================== */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --neon-cyan: #06b6d4;
      --btn-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      max-width: 550px;
      width: 100%;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 0;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 35px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    input, select {
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    select option {
      background: #1e1b4b;
      color: #fff;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--neon-cyan);
    }

    .btn-pagar {
      width: 100%;
      padding: 18px;
      background: var(--btn-success);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
    }

    .btn-pagar:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
      filter: brightness(1.1);
    }

    .hidden {
      display: none !important;
    }

    .panel-fijas {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .grid-interactivo {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 12px;
    }

    .celda-interactiva {
      width: 62px;
      height: 62px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .celda-interactiva:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      background: rgba(6, 182, 212, 0.1);
      transform: scale(1.05);
    }

    .celda-interactiva.fijada {
      border-style: solid;
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .btn-limpiar {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎲 Lotería PRO</h2>
  <div class="tagline">Plataforma de Loterías Personalizadas Profesionales</div>

  <div class="form-group">
    <label>Modalidad de juego:</label>
    <select id="modalidad" onchange="cambiarModalidad()">
      <option value="oficial" selected>Lotería Oficial Tradicional</option>
      <option value="pocito">Lotería de Pocitos (Variante Especial)</option>
      <option value="plantilla">Láminas de Baraja (54 Cartas)</option>
    </select>
  </div>

  <div class="form-group">
    <label id="lblCantidad">Cantidad de tablas / bloques:</label>
    <input type="number" id="cantidad" value="10" min="1" max="100">
  </div>

  <div class="form-group">
    <label id="lblAncho">Ancho total del tablero (cm):</label>
    <input type="number" id="anchoCm" value="16" step="0.1">
  </div>

  <div class="form-group">
    <label id="lblAlto">Alto total del tablero (cm):</label>
    <input type="number" id="altoCm" value="22" step="0.1">
  </div>

  <div class="form-group" id="grupoEspacio">
    <label>Separación entre tablas en la hoja (cm):</label>
    <input type="number" id="espacioCm" value="0.5" step="0.1">
  </div>

  <div id="opcionesOficial">
    <div class="form-group">
      <label>Tamaño de la cuadrícula:</label>
      <select id="tamano" onchange="renderizarGridInteractivo()">
        <option value="3">3x3</option>
        <option value="4" selected>4x4 (Tradicional)</option>
        <option value="5">5x5</option>
        <option value="6">6x6</option>
      </select>
    </div>

    <div class="panel-fijas">
      <label>🎯 Fijar Cartas en la Tabla (Opcional, Máx. 10):</label>
      <div id="gridInteractivo" class="grid-interactivo"></div>
      <button type="button" class="btn-limpiar" onclick="limpiarCartasFijas()">Limpiar selección</button>
    </div>

    <div class="form-group">
      <label>Forma de las celdas:</label>
      <select id="forma">
        <option value="cuadrado" selected>Cuadrado</option>
        <option value="circulo">Círculo</option>
        <option value="rectangulo">Rectángulo vertical</option>
      </select>
    </div>
  </div>

  <div id="opcionesPlantilla" class="hidden">
    <div class="form-group">
      <label>Distribución interna de la lámina:</label>
      <select id="grid">
        <option value="9x6" selected>9 x 6 (Predeterminado)</option>
        <option value="6x9">6 x 9</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Estilo de fondo de la hoja:</label>
    <select id="fondo">
      <option value="blanco" selected>Blanco limpio</option>
      <option value="gris">Gris técnico</option>
      <option value="negro">Negro oscuro</option>
      <option value="rojo">Rojo mexicano</option>
      <option value="azul">Azul profundo</option>
    </select>
  </div>

  <div class="checkbox-group" id="grupoBorde">
    <input type="checkbox" id="borde" checked>
    <label for="borde" style="cursor:pointer;">Dibujar contornos de corte</label>
  </div>

  <button class="btn-pagar" onclick="ejecutarGeneracionDirecta()">🔥 Generar y Descargar PDF</button>
</div>

<!-- LIBRERÍAS DE RENDERIZADO -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
