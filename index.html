<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotería PRO - ¡Corre y va corriendo!</title>
  
  <style>
    /* ==========================================
       🇲🇽 DISEÑO FOLCLÓRICO TRADICIONAL MODERNO
       ========================================== */
    :root {
      --bg-warm: #fbf7f0;       /* Fondo color cartón claro / papel kraft */
      --rosa-mexicano: #e61c5d; /* El alma de la feria */
      --azul-talavera: #0f4c81; /* Azul rey profundo de artesano */
      --verde-nopal: #1e5631;   /* Verde de los marcos clásicos */
      --text-dark: #2d241e;     /* Café oscuro para el texto, nada de gris frío */
      --text-muted: #7d6e65;
      --borde-tablero: #dfcaa7;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background-color: var(--bg-warm); 
      
      /* 🎪 PATRÓN DE PAPEL PICADO MEXICANO PARA EL FONDO WEB */
      background-image: 
        radial-gradient(circle at 50% 50%, #dfcaa7 1px, transparent 1px),
        radial-gradient(circle at 0 0, #dfcaa7 2px, transparent 2px),
        radial-gradient(circle at 100% 0, #dfcaa7 2px, transparent 2px),
        radial-gradient(circle at 100% 100%, #dfcaa7 2px, transparent 2px),
        radial-gradient(circle at 0 100%, #dfcaa7 2px, transparent 2px);
      background-size: 40px 40px;
      background-position: 0 0, 0 0, 40px 0, 40px 40px, 0 40px;
      
      color: var(--text-dark);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Contenedor principal que simula un gran Tablero de Lotería */
    .container {
      background: #ffffff;
      border: 6px double var(--rosa-mexicano); /* El clásico borde doble de las barajas */
      outline: 2px solid var(--azul-talavera);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(45, 36, 30, 0.15);
      max-width: 550px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
    }

    /* Decoración patria en la esquina superior */
    .container::before {
      content: "🇲🇽";
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 14px;
      opacity: 0.7;
    }

    h2 {
      text-align: center;
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 34px;
      text-transform: uppercase;
      color: var(--azul-talavera);
      margin-top: 0;
      margin-bottom: 4px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px var(--borde-tablero);
    }

    .tagline {
      text-align: center;
      color: var(--rosa-mexicano);
      font-size: 14px;
      margin-bottom: 35px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .form-group {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-dark);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Inputs y Selectores con estilo limpio y tradicional */
    input, select {
      padding: 12px 16px;
      border: 2px solid var(--borde-tablero);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: var(--text-dark);
      outline: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--azul-talavera);
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.15);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--rosa-mexicano);
    }

    /* 🎯 EL BOTÓN CON ESTILO DE JUEGO DE FERIA */
    .btn-pagar {
      width: 100%;
      padding: 18px;
      background: var(--rosa-mexicano);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-family: 'Arial Black', Impact, sans-serif;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 20px;
      letter-spacing: 1px;
      border-bottom: 5px solid #b30f42; /* Efecto 3D de botón de feria */
      box-shadow: 0 6px 15px rgba(230, 28, 93, 0.3);
    }

    .btn-pagar:hover {
      transform: translateY(-2px);
      background-color: #f5256b;
      box-shadow: 0 10px 20px rgba(230, 28, 93, 0.4);
    }

    .btn-pagar:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .hidden {
      display: none !important;
    }

    /* Panel de Selección de Cartas Fijas */
    .panel-fijas {
      background: var(--bg-warm);
      border: 2px dashed var(--azul-talavera);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .grid-interactivo {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
      background: #fff;
      padding: 12px;
      border: 2px solid var(--borde-tablero);
      border-radius: 8px;
    }

    /* Celdas del grid interactivo */
    .celda-interactiva {
      width: 62px;
      height: 62px;
      background: var(--bg-warm);
      border: 1px solid var(--borde-tablero);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .celda-interactiva:hover {
      border-color: var(--rosa-mexicano);
      color: var(--rosa-mexicano);
      background: #fff;
      transform: scale(1.05);
    }

    .celda-interactiva.fijada {
      border: 2px solid var(--verde-nopal);
      background: #eef7f2;
      color: var(--verde-nopal);
    }

    .btn-limpiar {
      background: #fff;
      color: #c92a2a;
      border: 2px solid #ffc9c9;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-limpiar:hover {
      background: #fff5f5;
      border-color: #c92a2a;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>¡Lotería PRO!</h2>
  <div class="tagline">¡Corre y va corriendo para tus PDFs!</div>

  <div class="form-group">
    <label>Modalidad de juego:</label>
    <select id="modalidad" onchange="cambiarModalidad()">
      <option value="oficial" selected>Lotería Oficial Tradicional</option>
      <option value="pocito">Lotería de Pocitos (Variante Especial)</option>
      <option value="plantilla">Láminas de Baraja (54 Cartas)</option>
    </select>
  </div>

  <div class="form-group">
    <label id="lblCantidad">Cantidad de tablas / bloques:</label>
    <input type="number" id="cantidad" value="10" min="1" max="100">
  </div>

  <div class="form-group">
    <label id="lblAncho">Ancho total del tablero (cm):</label>
    <input type="number" id="anchoCm" value="14" step="0.1">
  </div>

  <div class="form-group">
    <label id="lblAlto">Alto total del tablero (cm):</label>
    <input type="number" id="altoCm" value="20" step="0.1">
  </div>

  <div class="form-group" id="grupoEspacio">
    <label>Separación entre tablas en la hoja (cm):</label>
    <input type="number" id="espacioCm" value="0.5" step="0.1">
  </div>

  <div id="opcionesOficial">
    <div class="form-group">
      <label>Tamaño de la cuadrícula:</label>
      <select id="tamano" onchange="renderizarGridInteractivo()">
        <option value="3">3x3</option>
        <option value="4" selected>4x4 (Tradicional)</option>
        <option value="5">5x5</option>
        <option value="6">6x6</option>
      </select>
    </div>

    <div class="panel-fijas">
      <label>🎯 Fijar Cartas en la Tabla (Opcional, Máx. 10):</label>
      <div id="gridInteractivo" class="grid-interactivo"></div>
      <button type="button" class="btn-limpiar" onclick="limpiarCartasFijas()">Limpiar selección</button>
    </div>

    <div class="form-group">
      <label>Forma de las celdas:</label>
      <select id="forma">
        <option value="cuadrado" selected>Cuadrado</option>
        <option value="circulo">Círculo</option>
        <option value="rectangulo">Rectángulo vertical</option>
      </select>
    </div>
  </div>

  <div id="opcionesPlantilla" class="hidden">
    <div class="form-group">
      <label>Distribución interna de la lámina:</label>
      <select id="grid">
        <option value="9x6" selected>9 x 6 (Predeterminado)</option>
        <option value="6x9">6 x 9</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Estilo de fondo de la hoja (PDF):</label>
    <select id="fondo">
      <option value="blanco" selected>Blanco limpio</option>
      <option value="gris">Gris técnico</option>
      <option value="negro">Negro oscuro</option>
      <option value="rojo">Rojo mexicano</option>
      <option value="azul">Azul profundo</option>
    </select>
  </div>

  <div class="checkbox-group" id="grupoBorde">
    <input type="checkbox" id="borde" checked>
    <label for="borde" style="cursor:pointer;">Dibujar contornos de corte</label>
  </div>

  <button class="btn-pagar" onclick="ejecutarGeneracionDirecta()">🎉 ¡Generar Buenas Tablas! 🎉</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
